# facescore API. Installed by deploy/install.sh. __DOMAIN__ and __PORT__ are filled in.
limit_req_zone $binary_remote_addr zone=facescore_vote:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=facescore_score:10m rate=10r/m;

server {
    listen __LISTEN__;
    server_name __DOMAIN__;
    client_max_body_size 10m;

    # admin stays private until auth exists (CLAUDE.md task 6). Use it over SSH:
    #   curl -X POST http://127.0.0.1:__PORT__/admin/refit
    location /admin/ { return 404; }

    location = /vote  { limit_req zone=facescore_vote burst=10 nodelay;  proxy_pass http://127.0.0.1:__PORT__; include proxy_params; }
    location /score   { limit_req zone=facescore_score burst=5 nodelay;  proxy_pass http://127.0.0.1:__PORT__; include proxy_params; }
    location /        { proxy_pass http://127.0.0.1:__PORT__; include proxy_params; }
}
