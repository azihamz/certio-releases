# facescore API. Installed by deploy/install.sh. __DOMAIN__, __PORT__ and __LISTEN__ are filled in.
# Self-contained on purpose: no limit_req or proxy_params, so it works on any nginx build.
# Rate limiting belongs in the app (CLAUDE.md task 6).
server {
    listen __LISTEN__;
    server_name __DOMAIN__;
    client_max_body_size 10m;

    # admin stays private until auth exists. Use it over SSH:
    #   curl -X POST http://127.0.0.1:__PORT__/admin/refit
    location /admin/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
